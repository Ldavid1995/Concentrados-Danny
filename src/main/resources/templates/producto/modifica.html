<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modificar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5 mb-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Modificar Concentrado</h4>
                <!-- Botón rápido al panel principal desde el header -->
                <a th:href="@{/}" class="btn btn-sm btn-light">
                    <i class="fas fa-home me-1"></i> Panel Principal
                </a>
            </div>
            <div class="card-body">
                <form th:action="@{/producto/guardar}" th:object="${producto}" method="POST" enctype="multipart/form-data">
                    
                    <!-- Campos Ocultos -->
                    <input type="hidden" th:field="*{idProducto}"/>

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <!-- Ajustado a nombreProducto según la entidad Java -->
                        <input type="text" th:field="*{nombreProducto}" class="form-control" required/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Marca</label>
                        <input type="text" th:field="*{marca}" class="form-control" placeholder="Ej: Mimados, Aguilar..."/>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Especie</label>
                        <select th:field="*{especie}" class="form-select">
                            <option value="Perros">Perros</option>
                            <option value="Gatos">Gatos</option>
                            <option value="Aves">Aves</option>
                            <option value="Peces">Peces</option>
                            <option value="Bovinos">Bovinos</option>
                            <option value="Porcinos">Porcinos</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Unidad de Medida</label>
                        <select th:field="*{unidadMedida}" class="form-select">
                            <option value="Saco">Saco</option>
                            <option value="Kilo">Kilo</option>
                            <option value="Unidad">Unidad</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio (₡)</label>
                        <input type="number" th:field="*{precio}" class="form-control" step="0.01" required/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Existencias</label>
                        <input type="number" th:field="*{stock}" class="form-control" required/>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Número de Lote</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-barcode"></i></span>
                                <input type="text" name="lote" class="form-control" placeholder="Ej: L-2024-01"/>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Fecha de Vencimiento</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-calendar-alt"></i></span>
                                <input type="date" name="fechaVencimiento" class="form-control"/>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="archivoFicha" class="form-label fw-bold">Subir / Adjuntar Documento</label>
                        <input class="form-control" type="file" name="archivoFicha" id="archivoFicha" />
                    </div>

                    <!-- Botonera Inferior -->
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <!-- Volver al catálogo por especie -->
                            <a th:href="@{/producto/listado(especie=${producto.especie})}" class="btn btn-secondary me-2">
                                <i class="fas fa-arrow-left me-1"></i> Regresar al Listado
                            </a>

                            <!-- Volver al Panel Principal/Inicio -->
                            <a th:href="@{/}" class="btn btn-outline-dark">
                                <i class="fas fa-chart-line me-1"></i> Panel Principal
                            </a>
                        </div>

                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save me-1"></i> Actualizar Cambios
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
