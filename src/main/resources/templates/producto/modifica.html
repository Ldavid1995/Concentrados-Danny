<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}">
    <title>Modificar Producto</title>
</head>
<body>
    <header th:replace="~{general/fragmentos :: header}"></header>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h4><i class="fas fa-edit me-2"></i>Modificar Producto</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/producto/guardar}" th:object="${producto}" method="POST">
                            <input type="hidden" th:field="*{idProducto}" />

                            <div class="mb-3">
                                <label for="categoria" class="form-label fw-bold">Categoría</label>
                                <select id="categoria" th:field="*{categoria.idCategoria}" class="form-select" required>
                                    <option value="" disabled selected>-- Seleccione una Categoría --</option>
                                    <option th:each="cat : ${categorias}" 
                                            th:value="${cat.idCategoria}" 
                                            th:text="${cat.descripcion}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre del Producto</label>
                                <input type="text" th:field="*{nombre}" class="form-control" required/>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Marca</label>
                                <input type="text" th:field="*{marca}" class="form-control"/>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Descripción</label>
                                    <input type="text" th:field="*{descripcion}" class="form-control"/>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Unidad de Medida</label>
                                    <select th:field="*{unidadMedida}" class="form-select" required>
                                        <option value="Saco">Saco</option>
                                        <option value="Kilo">Kilo</option>
                                        <option value="Unidad">Unidad</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Precio (₡)</label>
                                    <input type="number" th:field="*{precio}" class="form-control" step="0.01" required/>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Existencias (Stock)</label>
                                    <input type="number" th:field="*{stock}" class="form-control" required/>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Stock Mínimo</label>
                                    <input type="number" th:field="*{stockMinimo}" class="form-control" required/>
                                </div>
                            </div>

                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activo">
                                <label class="form-check-label fw-bold" for="activo">Producto Activo</label>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/producto/listado}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-1"></i>Regresar
                                </a>
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save me-1"></i>Guardar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
