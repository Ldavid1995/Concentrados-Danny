<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{general/fragmentos :: head}"></th:block>
</head>
<body>

    <header th:replace="~{general/fragmentos :: header}"></header>

    <main class="container mt-4 mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="fw-bold text-success mb-0">
                <i class="fas fa-boxes me-2"></i>Catálogo de Productos
            </h2>
            <div class="d-flex gap-2">
                <a th:href="@{/}" class="btn btn-outline-secondary">
                    <i class="fas fa-home me-1"></i> Panel Principal
                </a>

                <!-- Botón Nuevo Producto sin restricción -->
                <a th:href="@{/producto/nuevo}" class="btn btn-primary">
                    <i class="fas fa-plus me-1"></i> Nuevo Producto
                </a>
            </div>
        </div>

        <div th:if="${productos != null and !productos.empty}" class="table-responsive shadow-sm rounded">
            <table class="table table-striped table-hover border align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="text-center">ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th class="text-center">Stock</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${productos}">
                        <td class="text-center fw-bold" th:text="${p.idProducto}">1</td>
                        <td th:text="${p.nombreProducto}" class="fw-semibold">Producto</td>
                        <td th:text="${p.descripcion}">Descripción</td>
                        <td th:text="${'₡' + p.precio}" class="text-success fw-bold">0.00</td>
                        <td class="text-center">
                            <span class="badge bg-secondary" th:text="${p.stock}">0</span>
                        </td>
                        <td class="text-center">
                            <div class="btn-group" role="group">
                                <!-- Botón Carrito -->
                                <a th:href="@{/deseos/carrito/agregar/} + ${p.idProducto}" 
                                   class="btn btn-sm btn-success" 
                                   title="Agregar al Carrito">
                                    <i class="fas fa-cart-plus"></i>
                                </a>

                                <!-- Botón Deseos -->
                                <a th:href="@{/deseos/agregar/} + ${p.idProducto}" 
                                   class="btn btn-sm btn-outline-danger" 
                                   title="Agregar a Lista de Deseos">
                                    <i class="fas fa-heart"></i>
                                </a>

                                <!-- Botón Editar (Visibilidad directa) -->
                                <a th:href="@{/producto/modificar/} + ${p.idProducto}" 
                                   class="btn btn-sm btn-warning text-white" 
                                   title="Editar Producto">
                                    <i class="fas fa-edit"></i>
                                </a>

                                <!-- Botón Eliminar (Visibilidad directa) -->
                                <a th:href="@{/producto/eliminar/} + ${p.idProducto}" 
                                   class="btn btn-sm btn-danger" 
                                   onclick="return confirm('¿Está seguro de eliminar este producto?')" 
                                   title="Eliminar Producto">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${productos == null or productos.empty}" class="alert alert-info text-center mt-3 shadow-sm">
            <i class="fas fa-info-circle me-2"></i> No hay productos registrados en el sistema.
        </div>

    </main>

    <footer th:replace="~{general/fragmentos :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
