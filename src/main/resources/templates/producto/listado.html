<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Catálogo de Productos</h2>
        <a th:href="@{/producto/nuevo}" class="btn btn-primary">Nuevo Producto</a>
    </div>

    <div th:if="${productos != null and !productos.empty}">
        <table class="table table-striped table-hover border">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.idProducto}">1</td>
                    <td th:text="${p.nombreProducto}">Producto</td>
                    <td th:text="${p.descripcion}">Descripción</td>
                    <td th:text="${'₡' + p.precio}">0.00</td>
                    <td th:text="${p.stock}">0</td>
                    <td>
                        <a th:href="@{/producto/modificar/} + ${p.idProducto}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/producto/eliminar/} + ${p.idProducto}" class="btn btn-sm btn-danger" onclick="return confirm('¿Desea eliminar este producto?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${productos == null or productos.empty}" class="alert alert-info">
        No hay productos registrados en el sistema.
    </div>

</body>
</html>
