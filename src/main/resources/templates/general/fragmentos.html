<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <title>Concentrados Danny</title>
    <meta charset="UTF-8"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #ffffff; }
        .navbar { background-color: #28a745 !important; }
        .user-name-nav { font-size: 0.9rem; color: #d4edda !important; text-decoration: none; transition: 0.3s; }
        .user-name-nav:hover { color: #ffffff !important; transform: scale(1.05); }
        .nav-link { display: flex; align-items: center; transition: all 0.2s; }
        .nav-link i { margin-right: 6px; }
        .nav-icon { font-size: 1.4rem; }
        .nav-link:hover .nav-icon { transform: scale(1.1); color: #d4edda !important; }
        .badge-carrito { font-size: 0.65rem; border: 1px solid white; }
        .footer-custom { background-color: #1e5631; color: white; padding: 20px 0; }
        .btn-historial { border: 1px solid rgba(255,255,255,0.5); color: white !important; }
        .btn-historial:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
            <div class="container">
                <a th:href="@{/perfil}" class="navbar-text fw-bold d-flex align-items-center user-name-nav me-auto" 
                   sec:authorize="isAuthenticated()" title="Ver mi Perfil">
                    <i class="fas fa-user-circle me-2 fs-5"></i>
                    <span th:text="${#authentication.name}">Usuario</span>
                </a>

                <a class="navbar-brand fw-bold fs-4 mx-auto" th:href="@{/}">Concentrados Danny</a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="ms-auto d-flex align-items-center">
                        
                        <a th:href="@{/}" title="Inicio" class="nav-link text-white me-3">
                            <i class="fas fa-home nav-icon"></i>
                        </a>

                        <a class="nav-link text-white me-3 position-relative" th:href="@{/deseos/carrito/lista}" title="Carrito">
                            <i class="fas fa-shopping-cart nav-icon"></i>
                            <span th:if="${session.listaItems != null and !session.listaItems.empty}" 
                                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger badge-carrito">
                                [[${session.listaItems.size()}]]
                            </span>
                        </a>

                        <a sec:authorize="isAuthenticated()" class="nav-link text-white fw-bold me-3 btn-historial rounded px-2" th:href="@{/venta/historial}" title="Mis Compras">
                            <i class="fas fa-clock-rotate-left"></i> Historial
                        </a>

                        <a class="nav-link text-white fw-bold me-3" th:href="@{/deseos/lista}">
                            <i class="fas fa-heart text-danger"></i> Deseos
                        </a>

                        <a class="btn btn-light btn-sm text-success fw-bold me-3 shadow-sm px-3" th:href="@{/producto/calculadora}">
                            <i class="fas fa-calculator"></i> Calculadora
                        </a>

                        <a class="nav-link text-white fw-bold me-3" th:href="@{/producto/cobertura}">
                            <i class="fas fa-map-marker-alt"></i> Cobertura
                        </a>
                        
                        <a sec:authorize="hasAnyRole('ADMIN', 'VENDEDOR')" class="nav-link text-white fw-bold me-3 text-warning" th:href="@{/reporte/principal}">
                            <i class="fas fa-chart-line"></i> Reportes
                        </a>

                        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="ms-2">
                            <button type="submit" class="btn btn-outline-light btn-sm" title="Cerrar Sesión">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Modal para Agregar Producto -->
    <div th:fragment="modalAgregarProducto" class="modal fade" id="agregarProductoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i>Agregar Nuevo Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/producto/guardar}" th:object="${producto}" method="POST" enctype="multipart/form-data">
                    <div class="modal-body">
                        
                        <input type="hidden" th:field="*{idProducto}" />

                        <!-- Seleccion de Categoria (Solución a ORA-01400) -->
                        <div class="mb-3">
                            <label for="categoria" class="form-label fw-bold">Categoría</label>
                            <select id="categoria" th:field="*{categoria.idCategoria}" class="form-select" required>
                                <option value="" disabled selected>-- Seleccione una Categoría --</option>
                                <option th:each="cat : ${categorias}" 
                                        th:value="${cat.idCategoria}" 
                                        th:text="${cat.descripcion}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre del Producto</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Concentrado Mascotas 10kg"/>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Marca</label>
                            <input type="text" th:field="*{marca}" class="form-control" placeholder="Ej: Aguilar, Mimados..."/>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Descripción</label>
                                <input type="text" th:field="*{descripcion}" class="form-control" placeholder="Ej: Para perros adultos"/>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Unidad de Medida</label>
                                <select th:field="*{unidadMedida}" class="form-select" required>
                                    <option value="Saco">Saco</option>
                                    <option value="Kilo">Kilo</option>
                                    <option value="Unidad">Unidad</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Precio (₡)</label>
                                <input type="number" th:field="*{precio}" class="form-control" step="0.01" required/>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Existencias (Stock)</label>
                                <input type="number" th:field="*{stock}" class="form-control" required/>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Stock Mínimo</label>
                                <input type="number" th:field="*{stockMinimo}" class="form-control" value="1" required/>
                            </div>
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activo" checked>
                            <label class="form-check-label fw-bold" for="activo">Producto Activo</label>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>Guardar Producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer th:fragment="footer" class="footer-custom mt-5">
        <div class="container text-center">
            <p class="mb-1">&copy; 2026 Concentrados Danny - San Rafael de Guatuso</p>
            <div class="social-icons">
                <a href="#" class="text-white me-3 text-decoration-none"><i class="fab fa-facebook fa-lg"></i></a>
                <a href="https://wa.me/50684681376" class="text-white text-decoration-none" target="_blank">
                    <i class="fab fa-whatsapp fa-lg"></i>
                </a>
            </div>
        </div>
    </footer>

</body>
</html>
